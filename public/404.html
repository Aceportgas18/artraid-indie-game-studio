<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <title>404 — Page Not Found | Artraid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: #000;
        color: #fff;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 2rem;
      }

      .container { max-width: 560px; }

      .code {
        font-size: clamp(5rem, 20vw, 10rem);
        font-weight: 900;
        letter-spacing: -0.05em;
        line-height: 1;
        color: #ea580c;
      }

      h1 {
        font-size: clamp(1.25rem, 4vw, 1.75rem);
        font-weight: 900;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        margin-top: 1.5rem;
        margin-bottom: 1rem;
      }

      p {
        color: #71717a;
        font-size: 0.9rem;
        line-height: 1.7;
        margin-bottom: 2.5rem;
        font-weight: 500;
      }

      a {
        display: inline-block;
        padding: 0.875rem 2.5rem;
        background: #fff;
        color: #000;
        font-weight: 900;
        font-size: 0.625rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        text-decoration: none;
        transition: background 0.25s ease, color 0.25s ease;
      }

      a:hover,
      a:focus-visible {
        background: #ea580c;
        color: #fff;
        outline: none;
      }

      a:focus-visible {
        outline: 2px solid #ea580c;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code" aria-hidden="true">404</div>
      <h1>Lost in the void</h1>
      <p>
        The universe you're looking for doesn't exist — or it may have drifted
        beyond the known map. Head back to the home system.
      </p>
      <a href="/">Return Home</a>
    </div>
  </body>
</html>
